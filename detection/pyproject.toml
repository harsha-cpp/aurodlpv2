[project]
name = "aurodlpv2-detection"
version = "0.1.0"
description = "Auro Healthcare DLP detection engine: Presidio + custom recognizers + OCR + risk scoring."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Auro Healthcare DLP" }]

dependencies = [
    "pydantic>=2.9.0",
    "spacy>=3.7.6",
    "python-stdnum>=1.20",
    "simple-icd-10-cm>=1.5.0,<2.0.0",
    "pymupdf>=1.24.10",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "python-pptx>=1.0.2",
    "striprtf>=0.0.28",
    "chardet>=5.2.0",
    "Pillow>=11.0.0",
    "python-magic>=0.4.27",
    "regex>=2024.9.11",
    "structlog>=24.4.0",
    # Kept out of the optional `ocr` extra deliberately: without it, OCR
    # returns "" and scanned documents pass clean.
    "pytesseract>=0.3.13",
    # The spaCy model is a hard dependency, not a runtime download. Without it
    # the engine silently degrades to a blank tokenizer and stops detecting
    # names entirely, which is exactly how the previous build shipped.
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
ocr = [
    "paddlepaddle>=2.6.2",
    "paddleocr>=2.8.1",
    "opencv-python-headless>=4.10.0",
]
medical-ner = [
    "transformers>=4.45.0",
    "torch>=2.4.1",
]
dev = [
    "ruff>=0.7.0",
    "pyright>=1.1.385",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.115.0",
    "pip-audit>=2.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The spaCy model ships as a wheel URL rather than from PyPI.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["aurodlpv2_detection"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
