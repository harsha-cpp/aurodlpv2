name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - name: Install
        run: |
          cd detection && uv sync --all-extras
          cd ../backend && uv sync --all-extras
      - name: Lint
        run: cd backend && uv run --frozen ruff check .
      - name: Typecheck
        run: cd backend && uv run --frozen pyright
      - name: Test
        run: cd backend && uv run --frozen pytest -q
      - name: Dependency audit
        run: cd backend && uv run --frozen pip-audit
      - name: SBOM
        run: cd backend && uvx --from cyclonedx-bom cyclonedx-py environment -o cyclonedx.json

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blade
          POSTGRES_PASSWORD: blade
          POSTGRES_DB: blade_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U blade"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - name: Install
        run: |
          cd detection && uv sync --all-extras
          cd ../backend && uv sync --all-extras
      - name: Migrate
        run: cd backend && uv run --frozen alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://blade:blade@localhost:5433/blade_test
          DATABASE_SYNC_URL: postgresql+psycopg://blade:blade@localhost:5433/blade_test
      - name: Integration tests
        run: cd backend && uv run --frozen pytest tests/integration -q --no-cov
        env:
          BLADE_TEST_DATABASE_URL: postgresql+asyncpg://blade:blade@localhost:5433/blade_test

  detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # The OCR pipeline tests skip themselves without the binary, and a
      # permanently-skipped test on the path that reads scanned prescriptions
      # is the same as no test at all.
      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-hin tesseract-ocr-tam libmagic1
      - run: cd detection && uv sync --all-extras
      - run: cd detection && uv run --frozen ruff check .
      - run: cd detection && uv run --frozen pyright
      - run: cd detection && uv run --frozen pytest -q
      - name: Detection accuracy (ratchet against committed baseline)
        run: cd detection && uv run --frozen python -m blade_detection.evaluation --check --failures
      - run: cd detection && uv run --frozen pip-audit
      - run: cd detection && uvx --from cyclonedx-bom cyclonedx-py environment -o cyclonedx.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm typecheck
      - run: cd frontend && pnpm lint
      - run: cd frontend && pnpm test
      - run: cd frontend && pnpm build
      - run: cd frontend && pnpm audit

  # Builds all three deployment images so a broken Dockerfile fails CI instead of
  # failing at deploy time. Nothing is pushed: `load: false, push: false` leaves
  # the result in the buildx cache only.
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The three images share a Python builder stage byte for byte, so one warm
      # cache serves api and worker. Scoped per image to stay under GitHub's 10GB
      # per-repo cache limit.
      - name: Validate compose files
        run: |
          docker compose -f infra/docker-compose.yml config --quiet
          # The prod stack refuses to render without its secrets, which is the
          # point; feed it throwaway values so the structure still gets checked.
          cp infra/.env.prod.example /tmp/ci.env
          sed -i \
            -e 's/^JWT_SECRET=.*/JWT_SECRET=ci-not-a-real-secret/' \
            -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/' \
            -e 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci/' \
            -e 's/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=ci-minio-pw/' \
            -e 's/^MFA_ENCRYPTION_KEY=.*/MFA_ENCRYPTION_KEY=ci-not-a-real-secret/' \
            /tmp/ci.env
          cp backend/.env.example infra/api.env
          docker compose -f infra/docker-compose.prod.yml --env-file /tmp/ci.env config --quiet
          rm -f infra/api.env

      # Build context is the repo root for every image: backend/pyproject.toml has
      # a path dependency on ../detection, which a backend-only context cannot see.
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          load: true
          tags: blade/api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: false
          load: true
          tags: blade/worker:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=worker,mode=max

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/dashboard.Dockerfile
          push: false
          load: true
          tags: blade/dashboard:ci
          build-args: |
            VITE_API_BASE_URL=https://api.ci.invalid
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

      # A Dockerfile that builds but produces an image that cannot start is not a
      # passing build. These are the assumptions the deploy actually depends on.
      - name: Smoke test images
        run: |
          set -euxo pipefail

          # Non-root everywhere.
          test "$(docker run --rm --entrypoint id blade/api:ci -u)" = "10001"
          test "$(docker run --rm --entrypoint id blade/worker:ci -u)" = "10001"
          test "$(docker run --rm --entrypoint id blade/dashboard:ci -u)" = "101"

          # The detection engine's native dependencies are present and loadable.
          docker run --rm --entrypoint python blade/api:ci -c \
            'import magic; assert magic.from_buffer(b"%PDF-1.4", mime=True) == "application/pdf"'
          docker run --rm --entrypoint python blade/api:ci -c \
            'import en_core_web_sm; en_core_web_sm.load()'
          docker run --rm --entrypoint sh blade/api:ci -c \
            'for l in eng hin mar tam tel ben kan mal guj pan ori; do tesseract --list-langs 2>&1 | grep -qx "$l" || { echo "missing tesseract lang: $l"; exit 1; }; done'
          docker run --rm --entrypoint pdftoppm blade/api:ci -v

          # OCR end to end: the binary, a language pack and the Python binding.
          # Without pytesseract this returns "" and a scanned attachment would
          # scan clean, so assert on real extracted text, not on the import.
          docker run --rm --entrypoint python blade/api:ci -c \
            'from PIL import Image, ImageDraw; from blade_detection.config import DetectionConfig; from blade_detection.ocr import extract_image_text; i=Image.new("RGB",(900,200),"white"); ImageDraw.Draw(i).text((20,80),"MRN 4471902",fill="black"); t,c=extract_image_text(i,DetectionConfig()); print(repr(t),c); assert "4471902" in t, "OCR produced no text"'

          # The worker's task actually registers.
          docker run --rm --entrypoint python blade/worker:ci -c \
            'from blade_backend.tasks.celery_app import celery_app as c; c.finalize(); assert "blade.scan.process_attachment" in c.tasks, sorted(c.tasks)'

          # The API answers /healthz.
          docker run -d --name api-smoke -p 8000:8000 blade/api:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/healthz | grep -q '"ok"'
          docker rm -f api-smoke

          # nginx serves the SPA, falls back to index.html, and sets the CSP.
          docker run -d --name dash-smoke -p 8080:8080 blade/dashboard:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/some/spa/route | grep -q 200
          curl -fsSI http://127.0.0.1:8080/ | grep -qi 'content-security-policy'
          docker rm -f dash-smoke
