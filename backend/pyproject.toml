[project]
name = "aurodlpv2-backend"
version = "0.1.0"
description = "Auro DLP v2 backend - FastAPI service for healthcare DLP scanning, policy enforcement, audit logging, and admin dashboard APIs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Auro DLP v2" }]

dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "starlette>=0.41.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
    "httpx>=0.27.2",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.3",
    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.1.1",
    "flower>=2.0.1",
    # Auth
    "google-auth>=2.35.0",
    "pyjwt[crypto]>=2.9.0",
    "argon2-cffi>=23.1.0",
    # Detection (local package)
    "aurodlpv2-detection",
    # Files / MIME
    "python-magic>=0.4.27",
    "aiofiles>=24.1.0",
    # Observability
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "sentry-sdk[fastapi]>=2.17.0",
    # Rate limit + CORS helpers
    "slowapi>=0.1.9",
    # Misc
    "orjson>=3.10.7",
    "tenacity>=9.0.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pyright>=1.1.385",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "respx>=0.21.1",
    "hypothesis>=6.115.0",
    "pip-audit>=2.7.3",
]

[tool.uv.sources]
aurodlpv2-detection = { path = "../detection", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aurodlpv2_backend"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["aurodlpv2_backend/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "TID", "PL", "RUF",
]
ignore = ["PLR0913"]  # Allow many args (DI handlers).

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportPrivateImportUsage = false
exclude = ["aurodlpv2_backend/db/migrations/versions", ".venv", "**/__pycache__"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=aurodlpv2_backend --cov-report=term-missing"
markers = [
    "unit: unit tests",
    "integration: requires postgres/redis",
    "e2e: end-to-end against running stack",
]

[tool.coverage.run]
branch = true
source = ["aurodlpv2_backend"]
omit = ["*/migrations/*", "*/tests/*"]
