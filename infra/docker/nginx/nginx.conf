# Blade DLP - admin dashboard (static SPA) served by nginx.
#
# This replaces the stock /etc/nginx/nginx.conf wholesale rather than dropping a
# server block into conf.d, because every writable path nginx uses (pid file,
# temp dirs) has to move out of /var/run and /var/cache for the master process to
# start as a non-root user.

worker_processes auto;
# /var/run is root-owned in the base image, so the runtime user cannot write a
# pid file there. /tmp/nginx is created and chowned in dashboard.Dockerfile —
# a dedicated directory rather than /tmp directly, because `nginx -t` during the
# build leaves a root-owned pid file behind that then blocks the non-root start.
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Same reason as the pid file: nginx creates these on demand and must be able
    # to write them as uid 101.
    client_body_temp_path /tmp/nginx/client-body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time'
    '}';
    access_log /dev/stdout json;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;              # do not advertise the nginx version
    keepalive_timeout 65;
    client_max_body_size 1m;        # this server only ever serves static files

    gzip              on;
    gzip_vary         on;           # so shared caches keep both encodings
    gzip_comp_level   6;
    gzip_min_length   1024;         # below this the framing costs more than it saves
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    server {
        # 8080, not 80: binding below 1024 needs CAP_NET_BIND_SERVICE, which a
        # non-root container should not hold. Publish it as :80 on the host.
        # No `listen [::]:8080` — nginx refuses to start if the host has IPv6
        # disabled, and the reverse proxy in front handles v6 termination.
        listen      8080;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        include /etc/nginx/snippets/security-headers.conf;

        # ---- Container health --------------------------------------------
        # Cheap, does not touch the filesystem, and stays out of the access log
        # so a 30s healthcheck does not drown real traffic.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ---- index.html ---------------------------------------------------
        # Matched both directly and via the try_files fallback below (the last
        # try_files argument is a URI, so nginx re-runs location matching).
        # It is the only unhashed file in the build: a cached copy pins a browser
        # to an asset bundle that the next deploy deletes.
        location = /index.html {
            include /etc/nginx/snippets/security-headers.conf;
            # add_header, not `expires`: the two together emit two conflicting
            # Cache-Control headers on the same response.
            add_header Cache-Control "no-store, must-revalidate" always;
        }

        # ---- Hashed build assets -----------------------------------------
        # Vite fingerprints everything under /assets/, so the URL is the version.
        location /assets/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Source maps are emitted by the current vite config (build.sourcemap is
        # true). They map straight back to the dashboard's TypeScript; do not hand
        # them to the public internet. Remove this block if you upload them to an
        # error tracker instead.
        location ~ \.map$ {
            deny all;
            access_log off;
        }

        # ---- SPA history fallback ----------------------------------------
        # react-router owns /overview, /select-org, /login, /events/:id ... none of
        # which exist on disk. Anything that is not a real file becomes index.html
        # and the router takes over client-side.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
