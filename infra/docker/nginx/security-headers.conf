# Security headers for the admin dashboard.
#
# nginx's add_header does NOT merge across levels: a location block that sets any
# add_header of its own discards every header inherited from the server block. So
# this snippet is included in the server block AND in each location that adds a
# Cache-Control, rather than relying on inheritance.
#
# __CSP_CONNECT_SRC__ is replaced at IMAGE BUILD TIME by dashboard.Dockerfile,
# derived from the VITE_API_BASE_URL build arg. It has to be build-time because
# the SPA bakes the same URL into its bundle, so a runtime override would let the
# two disagree; and nginx's envsubst templating only runs as root, which this
# container is not.

add_header X-Content-Type-Options     "nosniff"                          always;
add_header X-Frame-Options            "DENY"                             always;
add_header Referrer-Policy            "strict-origin-when-cross-origin"  always;
add_header Cross-Origin-Opener-Policy "same-origin"                      always;

# No camera/mic/geolocation in an admin console; deny them outright so a
# compromised dependency cannot even prompt for them.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# Vite emits hashed JS/CSS and no inline <script>, so script-src can stay strict.
# style-src needs 'unsafe-inline': Tailwind's runtime utilities and Recharts both
# set element style attributes. connect-src must list the API origin because the
# dashboard is served from a different origin than the API.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' __CSP_CONNECT_SRC__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# HSTS is deliberately absent: TLS is terminated by the reverse proxy in front of
# this container, and that proxy is the only thing that knows whether HTTPS is
# actually available for the whole domain. Set it there.
