# Blade DLP - production stack.
#
#   docker compose -f infra/docker-compose.prod.yml up -d
#
# Compose reads infra/.env for the ${...} values below. Copy infra/.env.prod.example
# to infra/.env and fill it in; every secret is `${VAR:?message}` so compose
# refuses to start rather than silently defaulting to something guessable.
# Application settings that are not secrets live in infra/api.env (copy from
# backend/.env.example). See docs/deployment.md.
#
# The dev stack is infra/docker-compose.yml and is unrelated to this file. Do not
# merge them with `-f`; the service names overlap on purpose but the volumes,
# credentials and images do not.
#
# NOT COVERED HERE: TLS. Every published port binds to 127.0.0.1 and expects a
# reverse proxy (nginx/Caddy/an ALB) in front terminating HTTPS. REFRESH_COOKIE_SECURE
# is required in production, so the app is unusable over plain HTTP anyway.

name: blade-prod

# ---------------------------------------------------------------------------
# Anchors
# ---------------------------------------------------------------------------

# Both Python services run the same code and need the same wiring. The values
# here override anything in api.env: they are the ones that MUST match this
# compose network, and an operator editing api.env cannot accidentally break them.
x-backend-env: &backend-env
  APP_ENV: production
  # asyncpg for the app, psycopg for alembic - two URLs, one set of credentials.
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  DATABASE_SYNC_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET - generate with `openssl rand -base64 48`}
  # Settings.enforce_production_security() refuses to boot without these three.
  REFRESH_COOKIE_SECURE: "true"
  REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-none}
  STORAGE_BACKEND: s3
  # MinIO here; drop S3_ENDPOINT_URL and set S3_REGION for real AWS S3.
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-blade-attachments}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  S3_REGION: ${S3_REGION:-ap-south-1}
  # MinIO rejects the AWS SSE header unless KMS is configured; leave empty for
  # MinIO, set to AES256 (or aws:kms) on real S3.
  S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
  # A JSON array, not a comma list - see the note in infra/.env.prod.example.
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS as a JSON array, e.g. ["https://dlp.hospital.example"]}
  # Public URL of the dashboard. Invite / password-reset / verify links are built
  # from it, so a wrong value produces mails nobody can act on.
  APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL - the dashboard URL, e.g. https://dlp.hospital.example}
  # Settings.enforce_production_security() also rejects MAILER_BACKEND=console.
  MAILER_BACKEND: smtp
  SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM, e.g. Blade DLP <no-reply@hospital.example>}
  SMTP_TLS: ${SMTP_TLS:-true}
  # TOTP secrets are encrypted with this. It defaults to JWT_SECRET, which means
  # rotating the JWT secret would lock every user out of MFA - keep them separate
  # and rotate them on separate schedules.
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY - a second independent secret}
  # Number of proxies that append to X-Forwarded-For between the client and the
  # API. 1 for a single nginx/Caddy in front; 2 behind an ALB *and* nginx. Wrong
  # values put every hospital in one login-rate-limit bucket, or let a client
  # spoof its own IP.
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
  # Hospitals run closed: operators create the tenant, staff arrive by invite.
  ALLOW_OPEN_SIGNUP: ${ALLOW_OPEN_SIGNUP:-false}
  SENTRY_DSN: ${SENTRY_DSN:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: json

x-backend-build: &backend-build
  # Repo root, not backend/: backend/pyproject.toml has a path dependency on
  # ../detection, which a backend-only context cannot see.
  context: ..
  args:
    BUILDKIT_INLINE_CACHE: "1"

# Container logs are the only record of a scan decision that is not in Postgres.
# Uncapped json-file logging has filled the disk on more than one small install.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# For the three first-party images only. They declare a non-root USER, so the
# container never starts as root and needs no capability at all.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# For the stock postgres/redis/minio images. Their entrypoints start as root and
# drop to a service account (gosu / su-exec), which needs SETUID/SETGID, plus
# CHOWN/FOWNER/DAC_OVERRIDE to take ownership of the data volume on first boot.
# Dropping ALL here makes postgres fail with
# "error: failed switching to 'postgres': operation not permitted".
x-hardening-root-entrypoint: &hardening-root-entrypoint
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # scram-sha-256 rather than the image default md5.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -U/-d are required: bare pg_isready reports ready as soon as the
      # postmaster listens, which is before initdb has created the database.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -q"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Not published. Reach it with `docker compose exec postgres psql`, or open
    # an SSH tunnel; do not expose 5432 to a network.
    logging: *logging
    <<: *hardening-root-entrypoint
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }

  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    # Celery loses queued scans if Redis restarts without an AOF. appendfsync
    # everysec is the usual durability/throughput trade; a lost second of
    # enqueues is recoverable because the API records the ScanEvent first.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction   # never silently drop a queued task to reclaim memory
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging
    <<: *hardening-root-entrypoint
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: ${MINIO_BROWSER:-off}   # the console is an admin surface; off by default
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging
    <<: *hardening-root-entrypoint
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  # One-shot: create the attachment bucket and make sure it is not public.
  # Runs to completion and exits; `docker compose ps` will show it as Exited(0).
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-blade-attachments}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set blade http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "blade/$$S3_BUCKET"
        mc anonymous set none "blade/$$S3_BUCKET"
        # Attachments are transient: the worker deletes each blob after the scan,
        # but a crashed worker leaves one behind. Expire them so patient data does
        # not accumulate in object storage indefinitely.
        mc ilm rule add --expire-days 7 "blade/$$S3_BUCKET" 2>/dev/null || \
          echo "lifecycle rule already present or unsupported; set retention manually"
        echo "bucket $$S3_BUCKET ready"
    logging: *logging

  # One-shot schema migration. This, not an entrypoint flag, is why the API can
  # scale to N replicas safely: compose runs it to completion before any API or
  # worker container starts, so there is exactly one alembic process. (The image
  # entrypoint can also do this via RUN_MIGRATIONS=true, under a Postgres
  # advisory lock - see infra/docker/run-migrations.py - for deploy targets that
  # have no place to put an init container.)
  migrate:
    image: ${IMAGE_PREFIX:-blade}/api:${IMAGE_TAG:-latest}
    build:
      <<: *backend-build
      dockerfile: docker/api.Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./api.env
        required: true
    environment:
      <<: *backend-env
      WAIT_FOR_DB: "true"
    entrypoint: ["/usr/bin/tini", "--", "python", "/usr/local/bin/run-migrations.py"]
    command: []
    logging: *logging
    <<: *hardening

  api:
    image: ${IMAGE_PREFIX:-blade}/api:${IMAGE_TAG:-latest}
    build:
      <<: *backend-build
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        # The whole point: no API process starts against a schema that has not
        # been upgraded, and no API process races another to upgrade it.
        condition: service_completed_successfully
    env_file:
      - path: ./api.env
        required: true
    environment: *backend-env
    ports:
      # Loopback only - terminate TLS in a reverse proxy on the host.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      # Inherited from the image (HEALTHCHECK in api.Dockerfile); repeated here
      # only to give compose a longer start_period than a bare `docker run`.
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 30s
    volumes:
      # STORAGE_BACKEND=s3 keeps attachments in MinIO, but main.py still creates
      # these directories at startup and the quarantine module writes here.
      - api-state:/var/lib/blade
    logging: *logging
    <<: *hardening
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }
        reservations: { memory: 512m }

  worker:
    image: ${IMAGE_PREFIX:-blade}/worker:${IMAGE_TAG:-latest}
    build:
      <<: *backend-build
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: ./api.env
        required: true
    environment:
      <<: *backend-env
      # Detection is CPU-bound; keep prefork concurrency at or below the cpu limit.
      SCAN_MAX_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    command:
      - celery
      - -A
      - blade_backend.tasks.celery_app
      - worker
      - --loglevel=info
      - --concurrency=${WORKER_CONCURRENCY:-4}
      - --max-tasks-per-child=100      # bound the leak from PyMuPDF/Tesseract child processes
      - --without-gossip
      - --without-mingle
    # SIGTERM makes Celery finish the task in flight before exiting. A scan of a
    # large PDF can take tens of seconds; killing it loses the ScanEvent result.
    stop_grace_period: 120s
    volumes:
      - worker-state:/var/lib/blade
    logging: *logging
    <<: *hardening
    deploy:
      # The only service worth scaling horizontally: `docker compose up -d --scale worker=3`.
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits: { cpus: "4.0", memory: 4g }
        reservations: { memory: 1g }

  dashboard:
    image: ${IMAGE_PREFIX:-blade}/dashboard:${IMAGE_TAG:-latest}
    build:
      <<: *backend-build
      dockerfile: docker/dashboard.Dockerfile
      args:
        # BUILD-TIME. Vite inlines this into the bundle and the image bakes it
        # into the CSP connect-src, so changing it means rebuilding the image -
        # `docker compose up -d dashboard` alone will not pick up a new value.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL - the public URL of the API, e.g. https://dlp-api.hospital.example}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--tries=1", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Nothing is written to the image filesystem; nginx's scratch space is the
    # tmpfs below, owned by the runtime uid so the non-root master can use it.
    read_only: true
    tmpfs:
      - /tmp/nginx:uid=101,gid=101,mode=0700
    logging: *logging
    <<: *hardening
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

# ---------------------------------------------------------------------------
# Volumes - named, so `docker compose down` does not take the database with it.
# `docker compose down -v` still does. See docs/deployment.md for backups.
# ---------------------------------------------------------------------------
volumes:
  postgres-data:
  redis-data:
  minio-data:
  api-state:
  worker-state:
