name: aurodlpv2-dev

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: aurodlpv2
      POSTGRES_PASSWORD: aurodlpv2
      POSTGRES_DB: aurodlpv2
    ports: ["5433:5432"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurodlpv2"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aurodlpv2
      MINIO_ROOT_PASSWORD: aurodlpv2-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment: &app-environment
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://aurodlpv2:aurodlpv2@postgres:5432/aurodlpv2
      DATABASE_SYNC_URL: postgresql+psycopg://aurodlpv2:aurodlpv2@postgres:5432/aurodlpv2
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: aurodlpv2
      OBJECT_STORAGE_SECRET_KEY: aurodlpv2-secret
      OBJECT_STORAGE_BUCKET: aurodlpv2-quarantine
      JWT_SECRET: local-development-secret-change-for-production
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  migrate:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["aurodlpv2-worker"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
